<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>fleet voice</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    background: #0f1113; color: #e8eaed;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 24px; overflow: hidden;
  }
  h1 { font-size: 15px; font-weight: 600; color: #9aa0a6; letter-spacing: .04em; margin: 0; }
  #btn {
    width: 210px; height: 210px; border-radius: 50%;
    border: none; background: #1f6f6b; color: #fff;
    font-size: 19px; font-weight: 600; letter-spacing: .02em;
    box-shadow: 0 8px 40px rgba(31,111,107,.4); cursor: pointer;
    transition: transform .08s ease, background .15s ease, box-shadow .15s ease;
    touch-action: none; user-select: none;
  }
  #btn.rec { background: #d8322e; box-shadow: 0 0 0 14px rgba(216,50,46,.18), 0 8px 40px rgba(216,50,46,.4); transform: scale(1.04); }
  #btn.busy { background: #444; box-shadow: none; }
  #status { font-size: 13px; color: #9aa0a6; min-height: 18px; }
  #out {
    width: 100%; max-width: 560px; min-height: 96px; border-radius: 12px;
    background: #17191c; border: 1px solid #2a2d31; padding: 16px 18px;
    font-size: 17px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  #out:empty::before { content: "your words appear here"; color: #565b60; }
  #copy { font: inherit; font-size: 13px; color: #9aa0a6; background: none; border: 1px solid #2a2d31; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  #copy:active { background: #17191c; }
  .hint { font-size: 11px; color: #565b60; }
</style>
</head>
<body>
  <h1>◈ fleet voice</h1>
  <button id="btn">hold&nbsp;to&nbsp;talk</button>
  <div id="status"></div>
  <div id="out"></div>
  <button id="copy" hidden>copy</button>
  <div class="hint">transcribed by your fleet · nothing runs on this phone</div>

<script>
const RTDB = "https://signaling-dcfad-default-rtdb.europe-west1.firebasedatabase.app/mission-control/voice/jobs";
const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const out = document.getElementById("out");
const copyBtn = document.getElementById("copy");

let media, chunks = [], stream, recording = false, mime = "";

function pickMime() {
  for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac", ""]) {
    if (m === "" || (window.MediaRecorder && MediaRecorder.isTypeSupported(m))) return m;
  }
  return "";
}

async function ensureStream() {
  if (stream) return stream;
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return stream;
}

async function startRec() {
  if (recording) return;
  try { await ensureStream(); }
  catch (e) { statusEl.textContent = "microphone blocked — allow access"; return; }
  mime = pickMime();
  chunks = [];
  media = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  media.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  media.onstop = handleStop;
  media.start();
  recording = true;
  btn.classList.add("rec");
  btn.textContent = "listening…";
  statusEl.textContent = "";
}

function stopRec() {
  if (!recording) return;
  recording = false;
  btn.classList.remove("rec");
  btn.classList.add("busy");
  btn.textContent = "…";
  try { media.stop(); } catch (_) {}
}

function blobToB64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function handleStop() {
  const blob = new Blob(chunks, { type: media.mimeType || mime || "audio/webm" });
  if (blob.size < 800) { reset("too short — hold and speak"); return; }
  statusEl.textContent = "transcribing on your fleet…";
  try {
    const b64 = await blobToB64(blob);
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const job = { audio_b64: b64, mime: blob.type, status: "pending", ts: Date.now() };
    await fetch(`${RTDB}/${id}.json`, { method: "PUT", body: JSON.stringify(job) });
    const text = await pollResult(id);
    if (text && text.trim()) {
      out.textContent = (out.textContent ? out.textContent + " " : "") + text.trim();
      copyBtn.hidden = false;
      reset("");
    } else {
      reset("no speech detected");
    }
    fetch(`${RTDB}/${id}.json`, { method: "DELETE" }).catch(() => {});
  } catch (e) {
    reset("fleet unreachable — retry");
  }
}

async function pollResult(id) {
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 500));
    try {
      const r = await fetch(`${RTDB}/${id}.json`, { cache: "no-store" });
      const j = await r.json();
      if (j && j.status === "done") return j.text || "";
      if (j && j.status === "error") return "";
    } catch (_) {}
  }
  return "";
}

function reset(msg) {
  btn.classList.remove("busy", "rec");
  btn.textContent = "hold to talk";
  statusEl.textContent = msg || "";
}

// pointer (works for touch + mouse); hold to talk
btn.addEventListener("pointerdown", e => { e.preventDefault(); startRec(); });
btn.addEventListener("pointerup", e => { e.preventDefault(); stopRec(); });
btn.addEventListener("pointercancel", () => stopRec());
btn.addEventListener("pointerleave", () => { if (recording) stopRec(); });

copyBtn.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(out.textContent); copyBtn.textContent = "copied"; setTimeout(() => copyBtn.textContent = "copy", 1200); } catch (_) {}
});
</script>
</body>
</html>
