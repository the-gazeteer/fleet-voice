<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>mission control</title>
<style>
  :root{--bg:#0f1113;--panel:#17191c;--panel2:#1c1f23;--line:#2a2d31;--ink:#e8eaed;--dim:#9aa0a6;--faint:#565b60;--teal:#4aa9ad;--red:#d8322e;--green:#7bbf6a;--amber:#e0a13a;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overscroll-behavior:none;}
  header{padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  header b{color:var(--teal);}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 20px;}
  .view{display:none;} .view.on{display:block;}

  /* command */
  #cmdrow{display:flex;gap:8px;margin:4px 4px 12px;}
  #cmd{flex:1;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;}
  #cmdmic,#send{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:0 14px;}
  #cmdmic.rec{background:var(--red);border-color:var(--red);}
  #cmdnote{color:var(--faint);font-size:11px;margin:-6px 4px 12px;}

  /* sidebar */
  .cap{padding:14px 6px 5px;color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;}
  .cap.off{color:var(--amber);}
  .row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:var(--panel);margin-bottom:6px;font-size:16px;}
  .row:active{background:var(--panel2);}
  .row.org{font-weight:700;border:1px solid #24494a;}
  .row.sub{margin-left:20px;background:transparent;padding:8px 12px;font-size:14px;color:var(--dim);}
  .row.arch{margin-left:20px;background:transparent;padding:8px 12px;font-size:14px;color:var(--faint);}
  .kmark{width:16px;height:16px;flex:none;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;}
  .dot.working{background:var(--teal);animation:p 1.2s ease-in-out infinite;} .dot.done,.dot.finished{background:var(--green);} .dot.idle{background:var(--faint);} .dot.blocked{background:var(--amber);}
  @keyframes p{50%{opacity:.35;}}
  .row .git{margin-left:auto;color:var(--faint);font-size:12px;}
  .row .chev{margin-left:auto;color:var(--faint);}
  .row.sub .chev,.row.arch .chev{margin-left:auto;}
  .glyph{width:14px;text-align:center;color:var(--faint);flex:none;}
  .updated{color:var(--faint);font-size:11px;text-align:center;padding:8px 0;}

  /* report overlay */
  #rpt{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;}
  #rpt.on{display:flex;}
  #rpthead{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);}
  #rptback{font:inherit;font-size:15px;color:var(--teal);background:none;border:none;padding:0;}
  #rpttitle{font-size:14px;color:var(--dim);}
  #rptframe{flex:1;border:none;width:100%;background:#fff;}

  /* voice */
  #voicewrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:66vh;}
  #btn{width:min(60vw,220px);height:min(60vw,220px);border-radius:50%;border:none;background:#1f6f6b;color:#fff;font-size:19px;font-weight:600;box-shadow:0 8px 40px rgba(31,111,107,.4);touch-action:none;user-select:none;transition:transform .08s,background .15s,box-shadow .15s;}
  #btn.rec{background:var(--red);box-shadow:0 0 0 14px rgba(216,50,46,.18),0 8px 40px rgba(216,50,46,.4);transform:scale(1.04);}
  #btn.busy{background:#444;box-shadow:none;}
  #vstatus{font-size:13px;color:var(--dim);min-height:18px;}
  #out{width:100%;min-height:80px;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:14px 16px;font-size:17px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  #out:empty::before{content:"your words appear here";color:var(--faint);}
  #copy{font:inherit;font-size:13px;color:var(--dim);background:none;border:1px solid var(--line);border-radius:8px;padding:8px 16px;}

  nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom);}
  nav button{flex:1;font:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--dim);background:none;border:none;padding:12px 0 14px;}
  nav button.on{color:var(--teal);}
</style>
</head>
<body>
<header>◈ <b id="orgname">mission control</b><span id="hdrsub" style="margin-left:auto;color:var(--faint);font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;"></span><button id="reload" title="reload" style="margin-left:12px;font-size:17px;color:var(--dim);background:none;border:none;padding:2px 6px;">↻</button></header>
<main>
  <section id="v-fleet" class="view on">
    <div id="cmdrow"><input id="cmd" placeholder="order for mission control…" enterkeyhint="send"><button id="cmdmic">🎤</button><button id="send">send</button></div>
    <div id="cmdnote">delivered to the fleet orchestrator via the signaling transport</div>
    <div id="tree"></div>
    <div class="updated" id="updated"></div>
  </section>
  <section id="v-voice" class="view">
    <div id="voicewrap">
      <button id="btn">hold&nbsp;to&nbsp;talk</button>
      <div id="vstatus"></div>
      <div id="out"></div>
      <button id="copy" hidden>copy</button>
    </div>
  </section>
</main>
<nav><button data-view="fleet" class="on">◫ fleet</button><button data-view="voice">🎙 voice</button></nav>

<div id="rpt"><div id="rpthead"><button id="rptback">‹ back</button><span id="rpttitle"></span></div><iframe id="rptframe" sandbox="allow-scripts"></iframe></div>

<script>
const ROOT="https://signaling-dcfad-default-rtdb.europe-west1.firebasedatabase.app/mission-control";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const decKey=k=>k.replace(/~/g,'/').replace(/·/g,'.');
const encPath=p=>p.replace(/\//g,'~').replace(/\./g,'·');

/* vendor marks */
function starburst(){let r='';for(let i=0;i<12;i++){const a=i*Math.PI/6+0.13,L=i%3===0?9.6:i%3===1?7.2:8.5;r+=`<line x1="${(12+3.1*Math.cos(a)).toFixed(1)}" y1="${(12+3.1*Math.sin(a)).toFixed(1)}" x2="${(12+L*Math.cos(a)).toFixed(1)}" y2="${(12+L*Math.sin(a)).toFixed(1)}"/>`;}return `<svg class="kmark" viewBox="0 0 24 24"><g stroke="#D97757" stroke-width="2.3" stroke-linecap="round">${r}</g></svg>`;}
function knot(){let r='';for(let i=0;i<6;i++)r+=`<rect x="10.8" y="2.4" width="2.4" height="9.4" rx="1.2" transform="rotate(${i*60} 12 12) rotate(31 12 7.1)"/>`;return `<svg class="kmark" viewBox="0 0 24 24"><g fill="#10a37f">${r}</g></svg>`;}
const MARK={claude:starburst,codex:knot,gemini:()=>'<span class="kmark" style="color:#4285f4">✦</span>',cursor:()=>'<span class="kmark" style="color:#888">▮</span>'};
const mark=k=>(MARK[k]||(()=>'<span class="kmark" style="color:#999">●</span>'))();

let state=null,reports={},globalNode="air";

async function loadState(){
  try{const d=await(await fetch(`${ROOT}/fleet-state.json`,{cache:"no-store"})).json();if(d){state=d;globalNode=d.global||"air";render();}}catch(_){}
}
async function loadReports(){
  try{const d=await(await fetch(`${ROOT}/fleet-reports.json`,{cache:"no-store"})).json();if(d)reports=d;}catch(_){}
}
function reportHTML(node,path){
  const bucket=reports[node]||{};const raw=bucket[encPath(path)];if(!raw)return null;
  const css=bucket["_style·css"]||"";
  // inline the shared stylesheet (relative links won't resolve inside srcdoc)
  return raw.replace(/<link[^>]*_style\.css[^>]*>/gi, css?`<style>${css}</style>`:"");
}
function openReport(node,path,title){
  const html=reportHTML(node,path);
  if(!html){$("rpttitle").textContent="report not published yet";$("rptframe").srcdoc="<body style='font-family:sans-serif;color:#888;padding:24px'>This report hasn't synced to the cloud yet — it publishes within ~12s of changing.</body>";}
  else{$("rpttitle").textContent=title||path;$("rptframe").srcdoc=html;}
  $("rpt").classList.add("on");
}
$("rptback").addEventListener("click",()=>$("rpt").classList.remove("on"));

function render(){
  if(!state)return;
  $("orgname").textContent=state.org||"mission control";
  const nodes=state.nodes||[];
  let h="";
  // org row
  h+=`<div class="cap">organization</div>`;
  h+=`<div class="row org" data-node="${globalNode}" data-path="${esc((state.org||'org'))}.html" data-title="${esc(state.org)} — organization">${starburst()}<span>${esc(state.org||'mission control')}</span><span class="git">mission control</span></div>`;
  for(const n of nodes){
    h+=`<div class="cap ${n.ok?'':'off'}">⌂ ${esc(n.node)}${n.ok?'':' · offline'}</div>`;
    const agents=n.agents||[];
    if(!agents.length){h+=`<div class="row" style="color:var(--faint)"><span class="dot"></span><span>no agents</span></div>`;}
    for(const a of agents){
      h+=`<div class="row" data-node="${n.node}" data-path="${esc(a.name)}.html" data-title="${esc(a.name)}">${mark(a.kind)}<span class="dot ${a.status||''}"></span><span>${esc(a.name)}</span>${a.git?`<span class="git">${esc(a.git)}</span>`:`<span class="chev">›</span>`}</div>`;
      for(const s of (a.subs||[])){
        h+=`<div class="row sub" data-node="${n.node}" data-path="${encPath(a.name+'/'+(s.name||'sub')+'.html').replace(/·/g,'.').replace(/~/g,'/')}" data-title="${esc(s.name)}"><span class="dot ${s.status==='done'?'done':'working'}"></span><span>${esc(s.name)}</span><span class="chev">›</span></div>`;
      }
    }
  }
  $("tree").innerHTML=h;
  $("tree").querySelectorAll("[data-node]").forEach(el=>el.addEventListener("click",()=>openReport(el.dataset.node,el.dataset.path,el.dataset.title)));
  const age=Math.round((Date.now()-(state.updated||0))/1000);
  $("updated").textContent=`live · updated ${age<3?'just now':age+'s ago'}`;
  $("hdrsub").textContent=nodes.length+" nodes";
}

/* command */
async function sendCommand(t){if(!t.trim())return;const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);await fetch(`${ROOT}/mailbox/${globalNode}/${id}.json`,{method:"PUT",body:JSON.stringify({from:"phone",body:t,ts:Date.now()})});$("cmd").value="";$("cmdnote").textContent="✓ sent to "+globalNode;setTimeout(()=>$("cmdnote").textContent="delivered to the fleet orchestrator via the signaling transport",2500);}
$("send").addEventListener("click",()=>sendCommand($("cmd").value));
$("cmd").addEventListener("keydown",e=>{if(e.key==="Enter")sendCommand($("cmd").value);});

/* tabs */
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("v-fleet").classList.toggle("on",b.dataset.view==="fleet");$("v-voice").classList.toggle("on",b.dataset.view==="voice");}));

/* voice (shared recorder for button + cmd mic) */
let stream,media,chunks=[],recTarget=null,mime="";
function pickMime(){for(const m of ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac",""]){if(m===""||(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)))return m;}return "";}
async function ensureStream(){if(stream)return stream;stream=await navigator.mediaDevices.getUserMedia({audio:true});return stream;}
async function startRec(t){if(recTarget)return;try{await ensureStream();}catch(_){if(t==="voice")setV("mic blocked");return;}mime=pickMime();chunks=[];recTarget=t;media=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);media.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};media.onstop=onStop;media.start();}
function stopRec(){if(!recTarget)return;try{media.stop();}catch(_){}}
function b64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b);});}
async function transcribe(blob){const a=await b64(blob);const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);await fetch(`${ROOT}/voice/jobs/${id}.json`,{method:"PUT",body:JSON.stringify({audio_b64:a,mime:blob.type,status:"pending",ts:Date.now()})});for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,500));try{const j=await(await fetch(`${ROOT}/voice/jobs/${id}.json`,{cache:"no-store"})).json();if(j&&j.status==="done"){fetch(`${ROOT}/voice/jobs/${id}.json`,{method:"DELETE"}).catch(()=>{});return j.text||"";}if(j&&j.status==="error")return"";}catch(_){}}return"";}
async function onStop(){const t=recTarget;recTarget=null;const blob=new Blob(chunks,{type:media.mimeType||mime||"audio/webm"});if(t==="cmd")$("cmdmic").classList.remove("rec");if(t==="voice")btnBusy();if(blob.size<800){if(t==="voice")resetBtn("too short");return;}if(t==="voice")setV("transcribing on your fleet…");const text=await transcribe(blob);if(t==="voice"){if(text&&text.trim()){$("out").textContent=($("out").textContent?$("out").textContent+" ":"")+text.trim();$("copy").hidden=false;resetBtn("");}else resetBtn("no speech detected");}else if(t==="cmd"&&text&&text.trim())$("cmd").value=($("cmd").value?$("cmd").value+" ":"")+text.trim();}
const btn=$("btn");
function setV(m){$("vstatus").textContent=m||"";}
function btnBusy(){btn.classList.remove("rec");btn.classList.add("busy");btn.textContent="…";}
function resetBtn(m){btn.classList.remove("busy","rec");btn.textContent="hold to talk";setV(m);}
btn.addEventListener("pointerdown",e=>{e.preventDefault();btn.classList.add("rec");btn.textContent="listening…";setV("");startRec("voice");});
btn.addEventListener("pointerup",e=>{e.preventDefault();stopRec();});
btn.addEventListener("pointercancel",()=>stopRec());
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("out").textContent);$("copy").textContent="copied";setTimeout(()=>$("copy").textContent="copy",1200);}catch(_){}});
$("cmdmic").addEventListener("pointerdown",e=>{e.preventDefault();$("cmdmic").classList.add("rec");startRec("cmd");});
$("cmdmic").addEventListener("pointerup",e=>{e.preventDefault();stopRec();});

/* force a network-fresh copy (iOS standalone apps serve from cache on a plain reload) */
function hardReload(){location.href=location.pathname+"?v="+Date.now();}
$("reload").addEventListener("click",hardReload);
/* self-update: reload when a new build is published (matches the desktop app's hot-reload) */
let buildStamp=null;
async function checkBuild(){try{const v=await(await fetch(`${ROOT}/webapp-build.json`,{cache:"no-store"})).json();if(v&&buildStamp&&v!==buildStamp){hardReload();}if(v)buildStamp=v;}catch(_){}}

loadReports();loadState();
setInterval(loadState,3000);
setInterval(loadReports,12000);
setInterval(checkBuild,15000);
checkBuild();
</script>
</body>
</html>
